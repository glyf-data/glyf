[package]
name = "dbt-charts-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Rust core for dbt-charts manifest resolution and ggsql integration"

[lib]
name = "dbt_charts_core"
crate-type = ["cdylib", "rlib"]

[features]
default = []
extension-module = ["pyo3/extension-module"]

[dependencies]
ggsql = { version = "0.3.2", default-features = false }
pyo3 = { version = "0.23", features = ["abi3-py311"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
