name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish_to_testpypi:
        description: "Publish the built artifacts to TestPyPI (dry run of the PyPI release)"
        type: boolean
        default: false

permissions:
  contents: write

env:
  PYTHON_VERSION: "3.11"
  # Pinned for reproducible builds; bump deliberately. Floor is rust-version in Cargo.toml.
  RUST_TOOLCHAIN: "1.98.0"

jobs:
  check-version:
    name: check tag matches package version
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Compare versions
        shell: bash
        run: |
          py=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml | head -1)
          rs=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          init=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' src/glyf/__init__.py)
          echo "pyproject=$py cargo=$rs __init__=$init ref=$GITHUB_REF_NAME"
          [ "$py" = "$rs" ] && [ "$py" = "$init" ] || { echo "::error::version mismatch between pyproject.toml, Cargo.toml and src/glyf/__init__.py"; exit 1; }
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            [ "$GITHUB_REF_NAME" = "v$py" ] || { echo "::error::tag $GITHUB_REF_NAME does not match package version $py"; exit 1; }
          fi

  build-wheels:
    name: build wheel (${{ matrix.target }})
    needs: check-version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-15
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # The extension is built against the abi3 stable ABI (pyo3 `abi3-py311`),
      # so one wheel per target covers every supported Python version.
      - name: Build wheel
        uses: PyO3/maturin-action@v1.51.0
        with:
          command: build
          target: ${{ matrix.target }}
          rust-toolchain: ${{ env.RUST_TOOLCHAIN }}
          args: --release --locked --out dist
          manylinux: auto

      - name: Smoke test wheel
        shell: bash
        run: |
          python -m venv smoke
          if [ -d smoke/Scripts ]; then BIN=smoke/Scripts; else BIN=smoke/bin; fi
          "$BIN/python" -m pip install --quiet --upgrade pip
          "$BIN/python" -m pip install --quiet dist/*.whl
          "$BIN/glyf" --help

      - name: Upload wheel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.target }}
          path: dist/*.whl
          if-no-files-found: error

  build-sdist:
    name: build sdist
    needs: check-version
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Build source distribution
        uses: PyO3/maturin-action@v1.51.0
        with:
          command: sdist
          args: --out dist

      - name: Upload sdist artifact
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  publish-release:
    name: publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - build-wheels
      - build-sdist
    runs-on: ubuntu-latest

    steps:
      - name: Download wheel artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - name: Download sdist artifact
        uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist

      - name: Generate checksums
        working-directory: dist
        run: |
          sha256sum *.whl *.tar.gz > checksums.txt
          cat checksums.txt

      - name: Create or update GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/checksums.txt

  # Dry run: `workflow_dispatch` with publish_to_testpypi=true. Uses trusted
  # publishing (OIDC) — no API token secrets. Re-running with an already
  # uploaded version is a no-op because of skip-existing.
  publish-testpypi:
    name: publish to TestPyPI
    if: github.event_name == 'workflow_dispatch' && inputs.publish_to_testpypi
    needs:
      - build-wheels
      - build-sdist
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/glyf-core
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Check distributions
        run: pipx run twine check --strict dist/*

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/
          skip-existing: true
          print-hash: true

  # Real release: runs only on `v*` tags, after the GitHub Release exists, and
  # uploads exactly the same files. PyPI uploads are immutable, so this is the
  # last job on purpose.
  publish-pypi:
    name: publish to PyPI
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - publish-release
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/glyf-core
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Check distributions
        run: pipx run twine check --strict dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          print-hash: true
