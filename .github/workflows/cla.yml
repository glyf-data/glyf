name: cla

# One comment, once. A contributor who has not signed the CLA gets a comment
# on their first pull request with the sentence to reply with. The reply is
# recorded in signatures/cla.json on the cla-signatures branch, the check goes
# green, and every later pull request from that account passes without asking.
#
# pull_request_target runs with this repository's token so that it can comment
# and record a signature on a pull request from a fork. The action reads the
# pull request's metadata and never checks out or runs its code.

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    # On a comment, only act when it is on a pull request and is one of the two
    # sentences the action understands.
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request &&
       (github.event.comment.body == 'recheck' ||
        github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
    steps:
      - name: CLA assistant
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/glyf-data/glyf/blob/main/CLA.md
          path-to-signatures: signatures/cla.json
          # main is protected; signatures are committed here instead.
          branch: cla-signatures
          allowlist: kannandreams,dependabot[bot],github-actions[bot]
          lock-pullrequest-aftermerge: false
          create-file-commit-message: "chore(cla): create the signatures file"
          signed-commit-message: "chore(cla): $contributorName signed the CLA in #$pullRequestNo"
          custom-notsigned-prcomment: >-
            Thanks for the pull request. Before it can be merged, glyf needs
            you to accept its [Contributor License Agreement](https://github.com/glyf-data/glyf/blob/main/CLA.md).
            You keep the copyright in your work; the CLA grants the project the
            rights it needs to keep distributing it. It takes one comment, and
            you only do it once: reply to this pull request with exactly the
            sentence below.
          custom-pr-sign-comment: "I have read the CLA Document and I hereby sign the CLA"
          custom-allsigned-prcomment: "The CLA is signed. Thank you."
