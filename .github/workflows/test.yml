name: test

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  # Keep in step with release.yml. Floor is rust-version in Cargo.toml.
  RUST_TOOLCHAIN: "1.98.0"
  PYTHON_VERSION: "3.11"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Run CI
        run: make python-ci PYTHON_VERSION=${{ matrix.python-version }}

      - name: Upload coverage report
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          fail_ci_if_error: false

  trino:
    name: trino integration
    runs-on: ubuntu-latest
    services:
      trino:
        image: trinodb/trino:476
        ports:
          - 8080:8080

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install project and development dependencies
        run: |
          uv python install "$PYTHON_VERSION"
          uv sync --all-groups --python "$PYTHON_VERSION"

      - name: Wait for Trino to accept queries
        run: |
          for _ in $(seq 1 90); do
            if curl -fsS http://localhost:8080/v1/info | grep -q '"starting":false'; then
              exit 0
            fi
            sleep 2
          done
          echo "Trino did not become ready in time" >&2
          exit 1

      - name: Run the Trino integration tests
        env:
          GLYF_TRINO_HOST: localhost
        run: uv run pytest tests/test_trino_integration.py -v

  rust:
    name: rust core
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # pyo3 links against libpython here: unlike the release wheels, these
      # builds do not use the `extension-module` feature.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up Rust
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt,clippy
          rustup default "$RUST_TOOLCHAIN"

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Run Rust checks
        run: make rust
