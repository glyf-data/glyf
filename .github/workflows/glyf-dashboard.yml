name: glyf dashboard

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-dashboard:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Build dbt project
        run: |
          cd examples/simple_dbt
          uv run dbt seed --profiles-dir . --full-refresh --no-partial-parse
          uv run dbt build --profiles-dir .

      - name: Check glyf project health
        run: uv run glyf doctor --project-dir examples/simple_dbt

      - name: Build glyf site
        run: |
          uv run glyf build --project-dir examples/simple_dbt --zip

      - name: Upload static site artifact
        uses: actions/upload-artifact@v4
        with:
          name: glyf-site
          path: examples/simple_dbt/target/glyf/site
          if-no-files-found: error

      - name: Upload zipped static site
        uses: actions/upload-artifact@v4
        with:
          name: glyf-site-zip
          path: examples/simple_dbt/target/glyf/glyf-site.zip
          if-no-files-found: error

