<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Sales Dashboard screenshot placeholder</title>
  <desc id="desc">A wide placeholder banner for the Sales Dashboard screenshot.</desc>
  <rect width="1200" height="675" fill="#f6faf8"/>
  <rect x="40" y="40" width="1120" height="595" rx="8" fill="#ffffff" stroke="#d9e2ec" stroke-width="2"/>
  <text x="80" y="112" fill="#0f172a" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="700">Sales Dashboard</text>
  <text x="80" y="160" fill="#475569" font-family="Inter, Arial, sans-serif" font-size="24">Screenshot placeholder</text>
  <rect x="80" y="218" width="1040" height="330" rx="8" fill="#eef7f3" stroke="#cbd5e1"/>
  <rect x="150" y="410" width="120" height="78" fill="#008f5f"/>
  <rect x="320" y="360" width="120" height="128" fill="#00b8a9"/>
  <rect x="490" y="310" width="120" height="178" fill="#2563eb"/>
  <rect x="660" y="270" width="120" height="218" fill="#16a34a"/>
  <rect x="830" y="338" width="120" height="150" fill="#6d5dfc"/>
  <text x="80" y="596" fill="#64748b" font-family="Inter, Arial, sans-serif" font-size="20">Replace this 1200x675 banner with the rendered dashboard screenshot.</text>
</svg>
