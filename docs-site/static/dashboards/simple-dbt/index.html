<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>glyf dashboards</title>

  <link rel="stylesheet" href="assets/dashboard.css">

</head>
<body>
  <div class="glyf-page">
    <header class="glyf-header">
      <div class="glyf-header-top">
        <div class="glyf-header-main">
          <nav class="glyf-breadcrumb" aria-label="Breadcrumb">
            <span>glyf</span>
            <span>/</span>
            <span>dashboards</span>
          </nav>
          <div class="glyf-title-row">
            <h1 class="glyf-title">Dashboards</h1>
            <span class="glyf-badge">1</span>
          </div>
          <p class="glyf-subtitle">Static dashboard pages generated from glyf artifacts.</p>
        </div>
      </div>
    </header>
    <main class="glyf-content">
      <section class="glyf-section" aria-label="Dashboards">
        <div class="glyf-chart-grid" data-auto-columns="true">

          <article class="glyf-card">
            <div class="glyf-card-head">
              <div>
                <a class="glyf-card-title" href="dashboards/executive.html">Executive Dashboard</a>

                <div class="glyf-card-subtitle">Revenue from a minimal dbt-style project.</div>

              </div>
              <span class="glyf-badge">5 charts</span>
            </div>
          </article>

        </div>
      </section>
    </main>
  </div>
</body>
</html>
