name: macro_showcase
title: Macro Showcase
description: Demo dashboard that exercises built-in dashboard macros, aliases, and project macros.
tags:
  - macros
  - components
  - demo

filters:
  - field: plan
    values: source(activation_by_plan, plan)
  - field: focus
    values: [activation, sessions, retention]

toolbar:
  visibility: private
  actions: [share, visibility]

summary:
  - "{{ product_owner() }}"
  - "{{ label_value('Generated', now('%Y-%m-%d %H:%M')) }}"
  - "{{ ui.badge('Macro Showcase', tone='info') }}"
  - "{{ ui.link('Open glyfdata.com', 'https://glyfdata.com', title='Project') }}"

layout:
  columns: "36% 64%"

sections:
  - title: Summary Panel Macros
    description: These same components are also rendered through summary[] in the AI Summary drawer.
    columns: 2
    items:
      - component: "{{ product_owner() }}"
      - component: "{{ label_value('Generated', now('%Y-%m-%d %H:%M')) }}"
      - component: "{{ ui.badge('Macro Showcase', tone='info') }}"
      - component: "{{ ui.link('Open glyfdata.com', 'https://glyfdata.com', title='Project') }}"

  - title: UI Macros
    description: Core built-ins for labels, text, lists, badges, and links.
    columns: 2
    items:
      - component: "{{ ui.label_value('Owner', 'Analytics Engineering', note='ui.label_value') }}"
      - component: "{{ text('Plain text component via alias.', title='text alias') }}"
      - component: "{{ ui.text('Text created through ui.text.', title='ui.text') }}"
      - component: "{{ ui.list(source('activation_by_plan', 'plan'), title='ui.list from source(chart, field)') }}"
      - component: "{{ listofvalues(['Built-ins', 'Aliases', 'Project macros'], title='listofvalues alias') }}"
      - component: "{{ ui.link('View repository', 'https://github.com/glyf-data/glyf', title='ui.link') }}"

  - title: Alert Macros
    description: Generic and tone-specific alert helpers, built-in thresholds, and artifact-aware project macros.
    columns: 2
    items:
      - component: "{{ alert.message('Generic alert generated by alert.message.', title='alert.message', tone='info') }}"
      - component: "{{ alert.success('Everything is healthy.', 'alert.success') }}"
      - component: "{{ alert.warning('Warning state for the showcase.', 'alert.warning') }}"
      - component: "{{ alert.error('Error state for the showcase.', 'alert.error') }}"
      - component: "{{ echo('echo alias routes to alert.info', 'echo alias') }}"
      - component: "{{ alert.threshold('active_users', 'active_users', 4200, op='lt', title='Active users threshold') }}"
      - component: "{{ activation_health(chart='activation_rate_by_plan', field='activation_rate', threshold=80) }}"
      - component: "{{ ui.badge(status_emoji(chart='activation_rate_by_plan', field='activation_rate', threshold=80), tone='info') }}"

  - title: Artifact Data Helpers
    description: Built-ins and project macros can read chart rows, latest values, and source-driven lists.
    columns: 2
    items:
      - component: "{{ ui.label_value('Latest active users', latest_value('active_users', 'active_users')) }}"
      - component: "{{ ui.label_value('Activation plans', source('activation_by_plan', 'plan') | join(', '), note='distinct values from chart artifact data') }}"
      - component: "{{ ui.text('Custom macros can accept ctx as the first argument and inspect rows, fields, or derived values from generated chart artifacts.', title='Macro context') }}"

  - title: Time Macros
    description: Formatted timestamps with and without explicit timezones.
    columns: "40% 60%"
    items:
      - component: "{{ ui.label_value('Local time', time.now('%Y-%m-%d %H:%M'), note='time.now local timezone') }}"
      - component: "{{ ui.label_value('London time', time.now('%Y-%m-%d %H:%M', 'Europe/London'), note='time.now explicit timezone') }}"
      - component: "{{ ui.badge('Refreshed ' ~ now('%H:%M'), tone='success') }}"
      - component: "{{ ui.text('Time macros return strings and are usually embedded inside other UI components.', title='time integration') }}"

  - title: Components Beside Charts
    description: Macro-built components can share the same section grid as charts.
    columns: "35% 65%"
    items:
      - component: "{{ ui.text('Components and charts use the same layout engine once macros resolve to ComponentSpec.', title='Mixed layout') }}"
      - chart: active_users
      - component: "{{ ui.badge('Project macro + chart', tone='neutral') }}"
      - chart: activation_by_plan
