[project]
name = "dbt-charts"
version = "0.1.0"
description = "Experimental chart-as-code static dashboards for dbt projects."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [
    { name = "Kannan Kalidasan" },
]
keywords = ["dbt", "dashboards", "charts", "analytics", "static-site"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Visualization",
    "Topic :: Software Development :: Build Tools",
    "Typing :: Typed",
]
dependencies = [
    "typer>=0.12",
    "pyyaml>=6.0",
    "duckdb>=1.5.2",
    "altair>=6.1.0",
    "vl-convert-python>=1.9.0.post1",
    "pandas>=3.0.3",
    "jinja2>=3.1.6",
]

[project.scripts]
dbt-charts = "dbt_charts.cli:app"

[project.urls]
Repository = "https://github.com/kannandreams/dbt-charts"
Issues = "https://github.com/kannandreams/dbt-charts/issues"
Documentation = "https://kannandreams.github.io/dbt-charts/"

[dependency-groups]
dev = [
    "dbt-core>=1.11.9",
    "dbt-duckdb>=1.10.1",
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dbt_charts"]

[tool.hatch.build.targets.sdist]
include = [
    "src",
    "tests",
    "docs",
    "docs-site",
    "examples",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
    "CONTRIBUTING.md",
    "CODE_OF_CONDUCT.md",
    "pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
