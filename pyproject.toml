[project]
name = "dbt-ggsql"
version = "0.1.0"
description = "Chart-as-code dashboards for dbt projects."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "pyyaml>=6.0",
    "duckdb>=1.5.2",
    "altair>=6.1.0",
    "vl-convert-python>=1.9.0.post1",
    "pandas>=3.0.3",
    "jinja2>=3.1.6",
]

[project.scripts]
dbt-ggsql = "dbt_ggsql.cli:app"

[dependency-groups]
dev = [
    "dbt-core>=1.11.9",
    "dbt-duckdb>=1.10.1",
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
