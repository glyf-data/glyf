version: "3"

vars:
  PYTHON_VERSION: '{{.PYTHON_VERSION | default "3.11"}}'
  EXAMPLE_PROJECT: '{{.EXAMPLE_PROJECT | default "examples/simple_dbt"}}'

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list

  python:
    desc: Install the configured Python version with uv
    cmds:
      - uv python install {{.PYTHON_VERSION}}

  install:
    desc: Install project and development dependencies
    cmds:
      - uv sync --all-groups --python {{.PYTHON_VERSION}}

  test:
    desc: Run the test suite with coverage
    cmds:
      - task: coverage

  coverage:
    desc: Run the test suite and write coverage reports
    cmds:
      - uv run pytest --cov=src/glyf --cov-report=term-missing --cov-report=xml

  build:
    desc: Build package distributions for release
    cmds:
      - uv build

  example-build:
    desc: Run dbt and glyf build for the configured example project
    cmds:
      - cd {{.EXAMPLE_PROJECT}} && uv run dbt seed --profiles-dir . --full-refresh --no-partial-parse
      - cd {{.EXAMPLE_PROJECT}} && uv run dbt build --profiles-dir .
      - uv run glyf doctor --project-dir {{.EXAMPLE_PROJECT}}
      - uv run glyf build --project-dir {{.EXAMPLE_PROJECT}} --zip

  example-serve:
    desc: Serve the exported site for the configured example project
    cmds:
      - uv run glyf serve --project-dir {{.EXAMPLE_PROJECT}}

  dashboard-ci:
    desc: Run the example dashboard workflow used by GitHub Actions
    cmds:
      - cd {{.EXAMPLE_PROJECT}} && uv run dbt seed --profiles-dir . --full-refresh --no-partial-parse
      - cd {{.EXAMPLE_PROJECT}} && uv run dbt build --profiles-dir .
      - uv run glyf doctor --project-dir {{.EXAMPLE_PROJECT}}
      - uv run glyf build --project-dir {{.EXAMPLE_PROJECT}} --zip

  ci:
    desc: Run the same checks used by GitHub Actions
    cmds:
      - task: python
      - task: install
      - task: test
      - task: build
      - task: dashboard-ci
