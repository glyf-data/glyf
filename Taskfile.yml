version: "3"

vars:
  PYTHON_VERSION: '{{.PYTHON_VERSION | default "3.11"}}'
  EXAMPLE_PROJECT: '{{.EXAMPLE_PROJECT | default "examples/simple_dbt"}}'

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list

  python:
    desc: Install the configured Python version with uv
    cmds:
      - uv python install {{.PYTHON_VERSION}}

  install:
    desc: Install project and development dependencies
    cmds:
      - uv sync --all-groups --python {{.PYTHON_VERSION}}

  test:
    desc: Run the test suite
    cmds:
      - uv run pytest

  build:
    desc: Build package distributions
    cmds:
      - uv build

  dashboard-ci:
    desc: Run the example dashboard workflow used by GitHub Actions
    cmds:
      - uv run dbt seed --project-dir {{.EXAMPLE_PROJECT}} --profiles-dir {{.EXAMPLE_PROJECT}} --full-refresh --no-partial-parse
      - uv run dbt build --project-dir {{.EXAMPLE_PROJECT}} --profiles-dir {{.EXAMPLE_PROJECT}}
      - uv run dbt-charts doctor --project-dir {{.EXAMPLE_PROJECT}}
      - uv run dbt-charts render --project-dir {{.EXAMPLE_PROJECT}}
      - uv run dbt-charts dashboard --project-dir {{.EXAMPLE_PROJECT}}
      - uv run dbt-charts export --project-dir {{.EXAMPLE_PROJECT}} --clean --zip

  ci:
    desc: Run the same checks used by GitHub Actions
    cmds:
      - task: python
      - task: install
      - task: test
      - task: build
      - task: dashboard-ci
